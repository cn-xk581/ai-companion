[project]
name = "ai-girlfriend-agent"
version = "0.1.0"
description = "AI 女友 Agent：FastAPI + LangGraph 八节点状态图 + 记忆/工具/多模态子系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.3.0,<1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "openai>=1.40.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
embed = [
    "sentence-transformers>=3.0.0",
]
milvus = ["pymilvus>=2.4.0"]
pgvector = ["pgvector>=0.3.0"]

[project.scripts]
aigf-serve = "app.main:run"
aigf-demo = "examples.chat_demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "examples*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
